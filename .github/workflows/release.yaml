name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.22'
  REGISTRY: ghcr.io

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install BPF build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          KVER="$(uname -r)"
          PKGS=(clang llvm libbpf-dev linux-tools-common "linux-headers-${KVER}" make)
          if apt-cache show "linux-tools-${KVER}" >/dev/null 2>&1; then
            PKGS+=("linux-tools-${KVER}")
          fi
          sudo apt-get install -y "${PKGS[@]}"
          if ! command -v bpftool >/dev/null 2>&1 && [ -x "/usr/lib/linux-tools/${KVER}/bpftool" ]; then
            sudo ln -sf "/usr/lib/linux-tools/${KVER}/bpftool" /usr/local/bin/bpftool
          fi
          command -v bpftool

      - name: Generate vmlinux.h
        run: |
          if [ ! -f bpf/vmlinux.h ]; then
            bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
          fi

      - name: Build BPF programs
        run: make bpf

      - name: Run tests
        run: go test -v ./...

      - name: Build binaries for multiple platforms
        run: |
          mkdir -p dist
          VERSION=${{ github.ref_name }}

          # Both the agent and the kernelseal-exec shim ship for each arch: the
          # shim is copied into application containers, which may differ in
          # architecture from where it was built.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags="-w -s -X main.Version=${VERSION}" \
              -o dist/kernelseal-linux-$arch ./cmd
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags="-w -s -X main.Version=${VERSION}" \
              -o dist/kernelseal-exec-linux-$arch ./cmd/kernelseal-exec
          done

          # The BPF objects are architecture specific, so build them per arch
          # rather than shipping the host's copy in both tarballs.
          for arch in amd64 arm64; do
            make clean-bpf
            make bpf GOARCH=$arch
            tar -czvf dist/kernelseal-${VERSION}-linux-$arch.tar.gz \
              -C dist kernelseal-linux-$arch kernelseal-exec-linux-$arch \
              -C ${{ github.workspace }} bpf/*.bpf.o
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
