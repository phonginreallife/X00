name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.22'
  REGISTRY: ghcr.io

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Keyless signing exchanges this job's OIDC token for a short-lived
      # Sigstore certificate, so there is no signing key to store or rotate.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install BPF build dependencies
        run: bash scripts/ci-install-bpf-deps.sh "linux-headers-$(uname -r)" make

      - name: Generate vmlinux.h
        run: |
          if [ ! -f bpf/vmlinux.h ]; then
            /usr/local/bin/bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
          fi

      - name: Build BPF programs
        run: make bpf

      - name: Run tests
        run: go test -v ./...

      - name: Build binaries for multiple platforms
        run: |
          mkdir -p dist
          VERSION=${{ github.ref_name }}

          # Both the agent and the kernelseal-exec shim ship for each arch: the
          # shim is copied into application containers, which may differ in
          # architecture from where it was built.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags="-w -s -X main.Version=${VERSION}" \
              -o dist/kernelseal-linux-$arch ./cmd
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags="-w -s -X main.Version=${VERSION}" \
              -o dist/kernelseal-exec-linux-$arch ./cmd/kernelseal-exec
          done

          # The BPF objects are architecture specific, so build them per arch
          # rather than shipping the host's copy in both tarballs.
          for arch in amd64 arm64; do
            make clean-bpf
            make bpf GOARCH=$arch
            tar -czvf dist/kernelseal-${VERSION}-linux-$arch.tar.gz \
              -C dist kernelseal-linux-$arch kernelseal-exec-linux-$arch \
              -C ${{ github.workspace }} bpf/*.bpf.o
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare BPF headers for Docker
        run: |
          if [ ! -f bpf/vmlinux.h ]; then
            /usr/local/bin/bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
          fi
          ls -la bpf/vmlinux.h

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Without this the Dockerfile's ARG VERSION is empty, main.Version
          # falls back to "dev", and a running container cannot report which
          # release it is - the image tag says one thing, the binary says dev.
          build-args: |
            VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # Signed by digest rather than by tag. Tags are mutable, so a
          # signature bound to :v1.0.0 would still verify after that tag is
          # moved to a different image; a digest names one specific image.
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: dist/kernelseal-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach the SBOM to the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SBOM: dist/kernelseal-${{ github.ref_name }}-sbom.spdx.json
        run: |
          # Attached as an attestation as well as a release asset, so a
          # deployment that only ever sees the digest can still recover the
          # bill of materials without trusting this repository's file list.
          cosign attest --yes --type spdxjson \
            --predicate "$SBOM" \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Sign the release artifacts
        run: |
          # One signature over checksums.txt covers every tarball, since what
          # the file contains is their SHA-256 hashes.
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.cosign.bundle \
            dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.cosign.bundle
            dist/*-sbom.spdx.json
          body_path: .github/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
