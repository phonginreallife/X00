name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      # Both are included into the site by pymdownx.snippets, so a change to
      # either has to rebuild it.
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

# A queued run replacing an in-flight one is correct for a docs site: only the
# newest content matters. cancel-in-progress is off so a deploy is never killed
# halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      # --strict turns warnings into errors, so a broken internal link or a
      # page missing from the nav fails here rather than shipping.
      - name: Build
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
