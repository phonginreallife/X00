# KernelSeal Sidecar Deployment Template
#
# The application container's entrypoint is wrapped with kernelseal-exec, which
# fetches secrets from the sidecar over a unix socket and then exec's the real
# command. The application reads them as ordinary environment variables; nothing
# is written to the filesystem.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kernelseal-config
  namespace: default
data:
  config.yaml: |
    version: v1
    policy:
      mode: enforce          # disabled, audit, or enforce
      blockEnviron: true     # Block /proc/*/environ reads
      blockMem: true         # Block /proc/*/mem reads
      blockMaps: false       # Block /proc/*/maps reads
      blockPtrace: true      # Block ptrace to protected processes
      allowSelfRead: true    # Allow a process to read its own /proc files
      auditAll: false        # Audit all accesses, not just blocked ones

    secrets:
      - name: myapp-secrets
        selector:
          binary: "myapp"    # Applies to a process exec'd as "myapp"
        secretRefs:
          - name: DATABASE_PASSWORD
            source:
              secretKeyRef:
                name: myapp-db-credentials
                key: password
          - name: API_KEY
            source:
              secretKeyRef:
                name: myapp-api-key
                key: api-key

    monitoring:
      enabled: true
      metricsPort: 9090
      logLevel: info
      auditLog: /var/log/kernelseal/audit.log
---
apiVersion: v1
kind: Pod
metadata:
  name: kernelseal-demo
  labels:
    app: kernelseal-demo
    kernelseal.io/protected: "true"
spec:
  # Required so the sidecar shares a PID namespace with the application and can
  # protect its processes.
  shareProcessNamespace: true

  # Lets both containers share the socket directory when the app runs non-root.
  securityContext:
    fsGroup: 1000

  initContainers:
  # Copies the shim out of the KernelSeal image so the application image does not
  # need to bundle it or be rebuilt.
  - name: install-shim
    image: your-registry/kernelseal:latest
    command:
      - /bin/sh
      - -c
      - cp /usr/local/bin/kernelseal-exec /kernelseal/kernelseal-exec
    volumeMounts:
    - name: kernelseal-bin
      mountPath: /kernelseal

  containers:
  # Application container. No secret volumes and no secret env vars.
  - name: myapp
    image: alpine:latest
    # The original entrypoint becomes an argument to the shim. It waits for the
    # sidecar, then replaces itself with the real process.
    command:
      - /kernelseal/kernelseal-exec
      - --
      - sh
      - -c
      - 'echo "App starting"; sleep 3600'
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
    volumeMounts:
    - name: kernelseal-bin
      mountPath: /kernelseal
      readOnly: true
    - name: kernelseal-socket
      mountPath: /run/kernelseal

  # KernelSeal sidecar
  - name: kernelseal
    image: your-registry/kernelseal:latest
    args:
      - "-config=/etc/kernelseal/config.yaml"
      - "-exec-monitor=/bpf/exec_monitor.bpf.o"
      - "-lsm=/bpf/lsm_file_protect.bpf.o"
    securityContext:
      privileged: true
      capabilities:
        add:
          - SYS_ADMIN      # Required to load BPF programs
          - BPF            # Required to load BPF programs
          - PERFMON        # Required to attach tracepoints
          - SYS_RESOURCE   # Required to raise RLIMIT_MEMLOCK for BPF maps
    ports:
    - name: metrics
      containerPort: 9090
      protocol: TCP
    livenessProbe:
      httpGet:
        path: /healthz
        port: metrics
      initialDelaySeconds: 10
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /ready
        port: metrics
      initialDelaySeconds: 5
      periodSeconds: 10
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "500m"
    volumeMounts:
    - name: kernelseal-config
      mountPath: /etc/kernelseal
      readOnly: true
    - name: kernelseal-socket
      mountPath: /run/kernelseal
    - name: kernelseal-secrets-source
      mountPath: /var/run/secrets/kernelseal
      readOnly: true
    - name: sys-kernel-btf
      mountPath: /sys/kernel/btf
      readOnly: true
    - name: bpf-maps
      mountPath: /sys/fs/bpf

  volumes:
  - name: kernelseal-config
    configMap:
      name: kernelseal-config
  # Holds the shim binary, shared from the init container.
  - name: kernelseal-bin
    emptyDir: {}
  # Holds the delivery socket. Memory-backed so it never touches disk.
  - name: kernelseal-socket
    emptyDir:
      medium: Memory
      sizeLimit: 1Mi
  - name: kernelseal-secrets-source
    projected:
      sources:
      - secret:
          name: myapp-db-credentials
          items:
          - key: password
            path: myapp-db-credentials/password
      - secret:
          name: myapp-api-key
          items:
          - key: api-key
            path: myapp-api-key/api-key
  - name: sys-kernel-btf
    hostPath:
      path: /sys/kernel/btf
      type: DirectoryOrCreate
  - name: bpf-maps
    hostPath:
      path: /sys/fs/bpf
      type: DirectoryOrCreate
