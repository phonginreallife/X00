# KernelSeal DaemonSet - Run KernelSeal on every node (alternative to sidecar pattern)
# Use this when you want node-wide secret protection.
#
# One socket serves every pod on the node, so the socket itself is not an
# authorization boundary here. The accompanying ConfigMap sets
# policy.podIdentity: required, which makes the agent attribute each caller to a
# pod by its cgroup before any binding matches. Do not lower that setting on a
# shared node: without it, any pod that mounts /run/kernelseal can request every
# binding in this node's configuration by naming the binary.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kernelseal
  namespace: kernelseal-system
  labels:
    app.kubernetes.io/name: kernelseal
    app.kubernetes.io/component: security-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kernelseal
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kernelseal
        app.kubernetes.io/component: security-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: kernelseal-controller
      hostPID: true          # Required to monitor all processes
      hostNetwork: false     # Not needed
      
      tolerations:
      # Run on all nodes including control plane
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
      
      priorityClassName: system-node-critical
      
      containers:
      - name: kernelseal
        image: your-registry/kernelseal:latest
        imagePullPolicy: Always
        # These override the image CMD, so the BPF object paths must be repeated
        # here or the agent falls back to relative paths that do not resolve.
        args:
          - "-config=/etc/kernelseal/config.yaml"
          - "-exec-monitor=/bpf/exec_monitor.bpf.o"
          - "-lsm=/bpf/lsm_file_protect.bpf.o"
          # Uncomment and set to the GID your application runs as if it is not
          # root. The socket is 0660 root:root by default, so a non-root shim
          # gets EACCES on connect before it can request anything - which
          # surfaces as the shim refusing to start your app, not as a warning.
          # Keep the mode at 0660 and share by group rather than loosening it
          # (SECURITY.md), and add the same GID to the application pod:
          #     securityContext:
          #       supplementalGroups: [1000]
          # - "-socket-group=1000"
        
        securityContext:
          privileged: true
          capabilities:
            add:
              - SYS_ADMIN      # Required to load BPF programs
              - BPF            # Required to load BPF programs
              - PERFMON        # Required to attach tracepoints
              - SYS_RESOURCE   # Required to raise RLIMIT_MEMLOCK for BPF maps
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        
        ports:
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        
        volumeMounts:
        - name: config
          mountPath: /etc/kernelseal
          readOnly: true
        - name: kernelseal-socket
          mountPath: /run/kernelseal
        # Tracepoint ids are read from tracefs or debugfs. Neither is propagated
        # into a pod's mount namespace by the runtime, privileged or not, so both
        # are bind-mounted: modern systemd mounts tracefs at /sys/kernel/tracing,
        # older setups only expose it under debugfs. Missing both fails the attach
        # with "neither debugfs nor tracefs are mounted".
        - name: sys-kernel-tracing
          mountPath: /sys/kernel/tracing
          readOnly: true
        - name: sys-kernel-debug
          mountPath: /sys/kernel/debug
          readOnly: true
        - name: sys-kernel-btf
          mountPath: /sys/kernel/btf
          readOnly: true
        - name: bpf-maps
          mountPath: /sys/fs/bpf
        # The caller's cgroup is what authorizes a request under
        # policy.podIdentity: required. The path comes from procfs and the
        # numeric id from this mount, so without it the agent cannot tell which
        # pod is on the other end of the socket.
        - name: cgroup
          mountPath: /sys/fs/cgroup
          readOnly: true
        - name: proc
          mountPath: /host/proc
          readOnly: true

        env:
        # Required by policy.podIdentity. The agent watches only the pods on its
        # own node, and refuses to start in required mode without this, because a
        # pod watch it cannot scope is one it will not run.
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      
      volumes:
      - name: config
        configMap:
          name: kernelseal-config
      # Node-wide delivery socket. Pods reach it by mounting the same hostPath;
      # secrets themselves are never written to disk.
      - name: kernelseal-socket
        hostPath:
          path: /run/kernelseal
          type: DirectoryOrCreate
      # DirectoryOrCreate for both: requiring either one to exist would stop the
      # agent scheduling on a node that only has the other.
      - name: sys-kernel-tracing
        hostPath:
          path: /sys/kernel/tracing
          type: DirectoryOrCreate
      - name: sys-kernel-debug
        hostPath:
          path: /sys/kernel/debug
          type: DirectoryOrCreate
      - name: sys-kernel-btf
        hostPath:
          path: /sys/kernel/btf
          type: DirectoryOrCreate
      - name: bpf-maps
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
      - name: proc
        hostPath:
          path: /proc
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: kernelseal-metrics
  namespace: kernelseal-system
  labels:
    app.kubernetes.io/name: kernelseal
spec:
  selector:
    app.kubernetes.io/name: kernelseal
  ports:
  - name: metrics
    port: 9090
    targetPort: metrics
  type: ClusterIP
