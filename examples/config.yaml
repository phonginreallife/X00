# KernelSeal Configuration
# Copy this file to /etc/kernelseal/config.yaml and customize

version: v1

policy:
  # Enforcement mode:
  # - disabled: KernelSeal does nothing
  # - audit: Log accesses but don't block
  # - enforce: Log and block unauthorized access
  mode: enforce
  
  # Protect environment variables from being read via /proc/<pid>/environ
  blockEnviron: true
  
  # Protect process memory from being read via /proc/<pid>/mem
  blockMem: true
  
  # Protect memory maps from being read via /proc/<pid>/maps
  # Note: Some debugging tools need this, set to false if needed
  blockMaps: false
  
  # Prevent ptrace from attaching to protected processes
  blockPtrace: true
  
  # Allow a process to read its own /proc files
  # This is usually safe and needed for self-inspection
  allowSelfRead: true
  
  # Log all accesses (even allowed ones) for audit purposes
  auditAll: false
  
  # Kernel-side binary filtering (RECOMMENDED for production)
  # When enabled, KernelSeal only monitors processes matching configured binaries
  # This significantly reduces CPU overhead on busy systems
  # When disabled, KernelSeal monitors ALL process executions (higher overhead)
  kernelBinaryFilter: true

secrets:
  # Each binding names a binary. When a process is started through
  # kernelseal-exec, KernelSeal matches the binary being exec'd against these
  # selectors and returns the matching secrets as environment variables.
  #
  # A binary listed here only receives secrets if it is launched via the shim:
  #   kernelseal-exec -- /usr/bin/myapp
  #
  # ------------------------------------------------------
  # WORKING: Environment variable source (envRef)
  # ------------------------------------------------------

  # Example: pass secrets to the sleep command (for testing)
  - name: test-secrets
    selector:
      binary: "sleep"
    secretRefs:
      - name: MY_SECRET
        source:
          envRef: MY_SECRET_VALUE        # Reads from $MY_SECRET_VALUE env var
      - name: DB_PASSWORD
        source:
          envRef: DB_PASSWORD_VALUE      # Reads from $DB_PASSWORD_VALUE env var

  # Example: pass AWS credentials to the AWS CLI
  - name: aws-secrets
    selector:
      binary: "aws"
    secretRefs:
      - name: AWS_ACCESS_KEY_ID
        source:
          envRef: AWS_ACCESS_KEY_ID_VALUE
      - name: AWS_SECRET_ACCESS_KEY
        source:
          envRef: AWS_SECRET_ACCESS_KEY_VALUE

  # ------------------------------------------------------
  # WORKING: File source (fileRef)
  # ------------------------------------------------------
  
  # Example: Read secrets from files (Vault agent sidecar integration)
  - name: webapp-secrets
    selector:
      binary: "node"
    secretRefs:
      - name: JWT_SECRET
        source:
          fileRef: "/vault/secrets/jwt-secret"
      - name: API_KEY
        source:
          fileRef: "/run/secrets/api-key"

  # ------------------------------------------------------
  # PLANNED: Kubernetes secret source (secretKeyRef)
  # Requires Kubernetes API access - not yet implemented
  # ------------------------------------------------------
  
  # - name: postgres-secrets
  #   selector:
  #     binary: "psql"
  #   secretRefs:
  #     - name: PGPASSWORD
  #       source:
  #         secretKeyRef:
  #           name: postgres-credentials
  #           namespace: default
  #           key: password

  # ------------------------------------------------------
  # PLANNED: HashiCorp Vault source (vaultRef)
  # Requires Vault integration - not yet implemented
  # ------------------------------------------------------
  
  # - name: vault-secrets
  #   selector:
  #     binary: "myapp"
  #   secretRefs:
  #     - name: DB_PASSWORD
  #       source:
  #         vaultRef:
  #           path: "secret/data/myapp/db"
  #           key: "password"

monitoring:
  # Serves /metrics, /healthz and /ready on metricsPort.
  enabled: true
  metricsPort: 9090
  logLevel: info  # debug, info, warn, error
  auditLog: /var/log/kernelseal/audit.log

# ------------------------------------------------------
# Quick Start Example
# ------------------------------------------------------
#
# 1. Create a config with an environment variable secret:
#
#    cat > /etc/kernelseal/config.yaml << 'EOF'
#    version: v1
#    policy:
#      mode: enforce
#      blockEnviron: true
#      blockMem: true
#      blockPtrace: true
#      kernelBinaryFilter: true
#    secrets:
#      - name: test
#        selector:
#          binary: "sleep"
#        secretRefs:
#          - name: SECRET_KEY
#            source:
#              envRef: SECRET_KEY_VALUE
#    EOF
#
# 2. Start the agent with the secret value in its own environment:
#
#    export SECRET_KEY_VALUE="my-secret-123"
#    sudo kernelseal -config /etc/kernelseal/config.yaml \
#      -exec-monitor bpf/exec_monitor.bpf.o \
#      -lsm bpf/lsm_file_protect.bpf.o
#
# 3. Start a process through the shim, which applies the secret and marks the
#    process protected before it starts:
#
#    kernelseal-exec -- sleep 300 &
#
# 4. Confirm the environment is unreadable from outside the process:
#
#    cat /proc/$!/environ   # Operation not permitted
#
#    Reading it from within the process still works while allowSelfRead is true.
