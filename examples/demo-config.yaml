# KernelSeal Demo Configuration
#
# Secrets are delivered to processes started through kernelseal-exec, so the
# selectors below name the demo application rather than arbitrary commands.

version: v1

policy:
  # audit so the demo works on kernels without BPF-LSM, which includes WSL2 and
  # most stock kernels. Secrets are delivered and the shim warns that the kernel
  # is not guarding them.
  #
  # Set this to enforce on a kernel booted with lsm=...,bpf to see reads actually
  # refused. In enforce mode without BPF-LSM the agent withholds secrets entirely,
  # which is correct but makes the demo look like it is doing nothing.
  mode: audit
  blockEnviron: true
  blockMem: true
  blockMaps: false
  blockPtrace: true
  allowSelfRead: true
  auditAll: false

  # The demo only cares about the demo app, so let the kernel filter the rest.
  kernelBinaryFilter: true

secrets:
  - name: demo-app-secrets
    selector:
      binary: "demo-app.sh"
    secretRefs:
      - name: DEMO_API_KEY
        source:
          envRef: "KERNELSEAL_DEMO_API_KEY"
      - name: DEMO_DB_PASSWORD
        source:
          envRef: "KERNELSEAL_DEMO_DB_PASSWORD"

  # Wrapping `sleep` is handy for testing protection by hand:
  #   kernelseal-exec -- sleep 300 &
  #   cat /proc/$!/environ   # Operation not permitted
  - name: sleep-demo
    selector:
      binary: "sleep"
    secretRefs:
      - name: DEMO_SECRET
        source:
          envRef: "KERNELSEAL_DEMO_SECRET"

monitoring:
  enabled: true
  metricsPort: 9090
  # info keeps the interesting lines visible. Set to debug to also trace every
  # exec of a target binary, which is very noisy if something on the host runs
  # one of them in a loop.
  logLevel: info
  auditLog: /tmp/kernelseal-audit.log
